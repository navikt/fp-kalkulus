name: Bygg kontrakt

on:
  push:
    branches:
      - '**'
    paths:
      - 'kontrakt/**'
  workflow_dispatch:

jobs:
  build:
    name: Kontrakt
    permissions:
      contents: read
    uses: navikt/fp-gha-workflows/.github/workflows/build-feature.yml@main
    with:
      java-version: '25'
      working-directory: ./kontrakt # Sett working directory til kontrakt-mappen

  release-drafter:
    name: Update
    if: github.ref_name == 'master'
    needs: build
    permissions:
      contents: write
      pull-requests: read
    uses: navikt/fp-gha-workflows/.github/workflows/release-drafter.yml@main
